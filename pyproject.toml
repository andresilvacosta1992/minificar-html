[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minificar-html"
version = "0.3.0"
description = "CLI em português para minificar arquivos HTML recursivamente"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "André", email = "andresilvacosta1992@gmail.com" }]
keywords = ["html", "minificar", "minify", "cli", "otimizacao"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "rcssmin>=1.2,<2",
  "rjsmin>=1.2,<2",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=6"]

[project.scripts]
minificar-html = "minificar_html.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
